# Raises the version on main after each merge that changes the app (see "Versions" in docs/DEVELOPMENT.md).
# PRs don't bump it themselves: every bump touched the same lines, so PRs open at the same time always conflicted.
name: Bump version

on:
  push:
    branches: [main]
    # Paths that end up in the app. Docs, README, agent notes and CI changes don't get a bump.
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'addons/**'
      - 'assets/**'
      - 'installer/**'
      - 'project.godot'
      - 'export_presets.cfg'

permissions:
  contents: write

# Two merges in a row must not race: the second run waits for the first, then reads main before bumping.
concurrency:
  group: bump-version

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commit is made through the GraphQL API rather than pushed with git: GitHub signs commits it creates
      # for the workflow's token, so the release tags put on these commits show as Verified.
      - name: Bump the version
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: main
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/dev/bump_version_on_branch.sh
